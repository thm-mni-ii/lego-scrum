<div style="height: 100%; width: 100%" class="d-flex justify-content-center align-items-center" #pageContainer>
  <div class="d-flex flex-column justify-content-between" style="height: 600px; width: 800px; transform: scale({{scale}}, {{scale}})">
    <div class="p-3">
      <div class="d-flex justify-content-between">
        <h4>Lego SCRUM {{this.title()}}</h4>
        <img ngSrc="assets/mni.svg" alt="THM MNI Logo" height="39" width="300" priority>
      </div>
      <div class="d-flex justify-content-between">
        <app-product-backlog-display></app-product-backlog-display>
        <div class="d-flex flex-column align-items-end">
          <app-sprint-state-display></app-sprint-state-display>
          <app-stop-sign-display></app-stop-sign-display>
        </div>
      </div>
    </div>
    <div>
      <app-audio-controls></app-audio-controls>
      <app-timer-display></app-timer-display>
    </div>
  </div>
</div>
