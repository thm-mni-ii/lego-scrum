stages:
  - build

ci:
  stage: build
  tags:
    - nodejs
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/

build-homepage:
  stage: build
  tags:
    - nodejs
  script:
    - npm ci
    - npm run build -- --base-href "/~sspp77/legoscrum/"
  artifacts:
    paths:
      - dist/
