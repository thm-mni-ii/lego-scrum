stages:
  - build
  - deploy

ci:
  stage: build
  tags:
    - nodejs
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/

deploy-firebase:
  stage: deploy
  tags:
    - nodejs
  only:
    - main
  script:
    - npm ci
    - npm run build
    - npm run deploy -- --only hosting --token "$FIREBASE_TOKEN"
